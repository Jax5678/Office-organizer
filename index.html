function inferTypeFromScheme(schemeName) {
  const n = (schemeName || '').trim().toUpperCase();
  if (n === 'PMGSY' || n === 'MMSY') return 'Road';
  if (n === 'BSY') return 'Bridge';
  if (n === 'BUILDINGS' || n === 'BUILDING') return 'Building';
  return null;
}

function fyOptionsList() {
  const cur = currentFYYear();
  const years = [];
  for (let y = cur + 2; y >= cur - 12; y--) years.push(`${y}-${String(y + 1).slice(-2)}`);
  return years;
}

function groupProjectsByYear(list) {
  const byYear = {};
  list.forEach((p) => { const y = p.year || 'Unspecified'; (byYear[y] = byYear[y] || []).push(p); });
  const years = Object.keys(byYear).sort((a, b) => (a === 'Unspecified' ? 1 : b === 'Unspecified' ? -1 : b.localeCompare(a)));
  return years.map((y) => [y, byYear[y]]);
}

/* ---------------------------------- helpers --------------------------------- */

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function currentFYYear() {
  const d = new Date();
  const y = d.getFullYear();
  return (d.getMonth() + 1) >= 4 ? y : y - 1;
}
function currentFY() {
  const startYear = currentFYYear();
  return `${startYear}-${String(startYear + 1).slice(-2)}`;
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  if (isNaN(d)) return s;
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtBytes(n) {
  if (!n) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
function fileIcon(mimeType) {
  if (!mimeType) return FileIcon;
  if (mimeType.startsWith('image/')) return ImageIcon;
  if (mimeType.includes('sheet') || mimeType.includes('excel') || mimeType.includes('csv')) return FileSpreadsheet;
  return FileText;
}

const DB_NAME = 'siteRegisterDB';
const STORE_NAME = 'kv';
let dbPromise = null;
function getDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE_NAME); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function storageGet(key) {
  try {
    const db = await getDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result !== undefined ? req.result : null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { console.error(e); return null; }
}
async function storageSet(key, value) {
  try {
    const db = await getDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
    return true;
  } catch (e) { console.error('storage set failed', key, e); return false; }
}
async function storageDelete(key) {
  try {
    const db = await getDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* ignore */ }
}

function loadAnyFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function getLocation(timeoutMs) {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve({ ok: false, reason: 'Location is not supported by this browser.' }); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ ok: true, lat: pos.coords.latitude, lng: pos.coords.longitude }),
      (err) => {
        let reason = 'Could not get location.';
        if (err && err.code === 1) reason = 'Location permission denied. Enable it in your browser/site settings.';
        else if (err && err.code === 3) reason = 'Getting location timed out — try again with a clearer sky view.';
        resolve({ ok: false, reason });
      },
      { enableHighAccuracy: true, timeout: timeoutMs || 10000, maximumAge: 20000 }
    );
  });
}

async function stampAndCompressImage(dataUrl, lines, maxWidth = 1500, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      if (lines && lines.length) {
        const pad = Math.round(w * 0.022);
        const fontSize = Math.max(13, Math.round(w * 0.026));
        ctx.font = `${fontSize}px "IBM Plex Mono", monospace`;
        ctx.textBaseline = 'alphabetic';
        const lineHeight = fontSize * 1.4;
        let maxLineW = 0;
        lines.forEach((l) => { const mw = ctx.measureText(l).width; if (mw > maxLineW) maxLineW = mw; });
        const boxWidth = Math.min(w, maxLineW + pad * 2);
        const boxHeight = lineHeight * lines.length + pad * 0.8;
        ctx.fillStyle = 'rgba(18,22,16,0.60)';
        ctx.fillRect(0, h - boxHeight, boxWidth, boxHeight);
        ctx.fillStyle = '#F2F1E4';
        lines.forEach((line, i) => {
          const y = h - pad * 0.4 - (lines.length - 1 - i) * lineHeight;
          ctx.fillText(line, pad * 0.7, y);
        });
      }
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function buildAbstractWorkbook({ schemes, subSchemes, projects, fileIndex, fileMetas, siteLogs, grievances }) {
  const wb = XLSX.utils.book_new();

  const schemeRows = schemes.map((s) => {
    const schemeProjects = projects.filter((p) => p.schemeId === s.id);
    let docs = 0, photos = 0, progress = 0;
    schemeProjects.forEach((p) => {
      (fileIndex[p.id] || []).forEach((id) => {
        const m = fileMetas[id]; if (!m) return;
        if (m.section === 'document') docs++;
        else if (m.section === 'photo') photos++;
        else if (m.section === 'progress') progress++;
      });
    });
    const logsCount = schemeProjects.reduce((sum, p) => sum + ((siteLogs[p.id] || []).length), 0);
    const grievCount = schemeProjects.reduce((sum, p) => sum + ((grievances[p.id] || []).length), 0);
    return {
      Scheme: s.name,
      'Sub-schemes': subSchemes.filter((ss) => ss.schemeId === s.id).map((ss) => ss.name).join(', '),
      'Total Projects': schemeProjects.length,
      Ongoing: schemeProjects.filter((p) => p.status !== 'Completed').length,
      Completed: schemeProjects.filter((p) => p.status === 'Completed').length,
      Documents: docs, 'Progress Reports': progress, Photographs: photos,
      'Site Visits Logged': logsCount, Grievances: grievCount,
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(schemeRows), 'Scheme Abstract');

  const yearRows = [];
  schemes.forEach((s) => {
    const schemeProjects = projects.filter((p) => p.schemeId === s.id);
    const byYear = {};
    schemeProjects.forEach((p) => {
      const y = p.year || 'Unspecified';
      byYear[y] = byYear[y] || { total: 0, ongoing: 0, completed: 0 };
      byYear[y].total++;
      if (p.status === 'Completed') byYear[y].completed++; else byYear[y].ongoing++;
    });
    Object.keys(byYear).sort().reverse().forEach((y) => {
      yearRows.push({ Scheme: s.name, 'Financial Year': y, Total: byYear[y].total, Ongoing: byYear[y].ongoing, Completed: byYear[y].completed });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(yearRows), 'Year-wise');

  const projectRows = projects.map((p) => {
    const scheme = schemes.find((s) => s.id === p.schemeId);
    const sub = subSchemes.find((ss) => ss.id === p.subSchemeId);
    const ids = fileIndex[p.id] || [];
    let docs = 0, photos = 0, progress = 0;
    ids.forEach((id) => {
      const m = fileMetas[id]; if (!m) return;
      if (m.section === 'document') docs++;
      else if (m.section === 'photo') photos++;
      else if (m.section === 'progress') progress++;
    });
    const gList = grievances[p.id] || [];
    return {
      Project: p.name, Scheme: scheme ? scheme.name : '', 'Sub-scheme': sub ? sub.name : '',
      Type: p.type, 'Financial Year': p.year || '', Status: p.status || 'Ongoing', Constituency: p.constituency || '', Location: p.location,
      Documents: docs, 'Progress Reports': progress, Photographs: photos, 'Site Visits': (siteLogs[p.id] || []).length,
      'Grievances (Pending)': gList.filter((g) => g.status === 'Pending').length,
      'Grievances (Resolved)': gList.filter((g) => g.status === 'Resolved').length,
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(projectRows), 'Projects');

  return wb;
}

function downloadWorkbook(wb, filename) {
  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

/* ------------------------------ confirm-to-delete ---------------------------- */

function ConfirmDelete({ onConfirm, variant = 'icon', label = 'Delete' }) {
  const [armed, setArmed] = useState(false);
  const timerRef = useRef(null);
  useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

  function handleClick(e) {
    e.stopPropagation();
    if (!armed) {
      setArmed(true);
      timerRef.current = setTimeout(() => setArmed(false), 4000);
    } else {
      clearTimeout(timerRef.current);
      setArmed(false);
      onConfirm();
    }
  }

  if (variant === 'button') {
    return (
      <button onClick={handleClick} className={armed ? 'btn-danger-armed' : 'btn-ghost'} style={!armed ? { color: C.danger, borderColor: C.danger } : undefined}>
        <Trash2 size={13} style={{ marginRight: 5 }} /> {armed ? 'Click again to confirm' : label}
      </button>
    );
  }
  return (
    <button onClick={handleClick} className={armed ? 'icon-btn-armed' : 'icon-btn-delete'} title={armed ? 'Click again to confirm' : label}>
      {armed ? <><AlertTriangle size={12} /> Confirm</> : <Trash2 size={14} />}
    </button>
  );
}

function SubDivisionSwitcher({ subDivisions, activeId, onSwitch, onAdd }) {
  const [open, setOpen] = useState(false);
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState('');
  const active = subDivisions.find((s) => s.id === activeId);

  function commitAdd() {
    if (name.trim()) onAdd(name);
    setName(''); setAdding(false); setOpen(false);
  }

  return (
    <div style={{ position: 'relative' }}>
      <button onClick={() => setOpen((o) => !o)} style={{
        display: 'flex', alignItems: 'center', gap: 6, background: 'rgba(255,255,255,0.10)', border: '1px solid rgba(255,255,255,0.25)',
        borderRadius: 6, padding: '7px 11px', cursor: 'pointer', color: '#fff', fontFamily: FONT_MONO, fontSize: 12,
      }}>
        <MapPin size={13} />
        <span>Sub-Division: <strong>{active ? active.name : '—'}</strong> · Block: {active ? active.name : '—'}</span>
        <ChevronDown size={13} />
      </button>
      {open && (
        <div style={{ position: 'absolute', top: '110%', right: 0, background: '#fff', borderRadius: 8, boxShadow: '0 8px 24px rgba(0,0,0,0.25)', minWidth: 220, zIndex: 50, overflow: 'hidden' }}>
          {subDivisions.map((s) => (
            <button key={s.id} onClick={() => { onSwitch(s.id); setOpen(false); }} style={{
              display: 'block', width: '100%', textAlign: 'left', padding: '10px 14px', background: s.id === activeId ? C.paperDark : 'none',
              border: 'none', borderBottom: `1px solid ${C.lineSoft}`, cursor: 'pointer', fontSize: 13, color: C.ink, fontWeight: s.id === activeId ? 700 : 500,
            }}>
              {s.name} {s.id === activeId && <span style={{ color: C.rust }}>●</span>}
            </button>
          ))}
          {adding ? (
            <div style={{ padding: 10 }}>
              <input autoFocus value={name} onChange={(e) => setName(e.target.value)} placeholder="New sub-division name" className="input"
                onKeyDown={(e) => { if (e.key === 'Enter') commitAdd(); if (e.key === 'Escape') { setAdding(false); setName(''); } }} />
              <div style={{ display: 'flex', gap: 6, marginTop: 6 }}>
                <button onClick={commitAdd} className="btn-primary" style={{ padding: '5px 10px', fontSize: 12 }}>Add</button>
                <button onClick={() => { setAdding(false); setName(''); }} className="btn-ghost" style={{ padding: '5px 10px', fontSize: 12 }}>Cancel</button>
              </div>
            </div>
          ) : (
            <button onClick={() => setAdding(true)} style={{ display: 'flex', alignItems: 'center', gap: 6, width: '100%', textAlign: 'left', padding: '10px 14px', background: 'none', border: 'none', cursor: 'pointer', fontSize: 13, color: C.rust, fontWeight: 600 }}>
              <Plus size={14} /> Add sub-division
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function ProjectRegister() {
  const [loaded, setLoaded] = useState(false);
  const [subDivisions, setSubDivisions] = useState([]);
  const [activeSubDivisionId, setActiveSubDivisionId] = useState(null);
  const [schemes, setSchemes] = useState([]);
  const [subSchemes, setSubSchemes] = useState([]);
  const [projects, setProjects] = useState([]);
  const [siteLogs, setSiteLogs] = useState({});
  const [grievances, setGrievances] = useState({});
  const [fieldLogs, setFieldLogs] = useState([]);
  const [ampEntries, setAmpEntries] = useState([]);
  const [proposalEntries, setProposalEntries] = useState([]);
  const [monthlyReports, setMonthlyReports] = useState([]);
  const [settings, setSettings] = useState({ mileage: 15 });
  const [fileIndex, setFileIndex] = useState({});
  const [fileMetas, setFileMetas] = useState({});

  const [expandedSub, setExpandedSub] = useState({});

  const [showAddScheme, setShowAddScheme] = useState(false);
  const [addProjectTarget, setAddProjectTarget] = useState(null); // { schemeId, subSchemeId }
  const [viewerFile, setViewerFile] = useState(null);
  const [busyMsg, setBusyMsg] = useState('');

  const skipSaveRef = useRef(true);

  /* -------------------------- load a sub-division's data ----------------------- */

  async function loadSubDivisionData(subId) {
    let app = await storageGet('appdata:' + subId);
    if (!app) {
      app = {
        schemes: DEFAULT_SCHEMES, subSchemes: [], projects: [], siteLogs: {}, grievances: {},
        fieldLogs: [], ampEntries: [], proposalEntries: [], monthlyReports: [], settings: { mileage: 15 }, fileIndex: {},
      };
      await storageSet('appdata:' + subId, app);
    }
    setSchemes(app.schemes || DEFAULT_SCHEMES);
    setSubSchemes(app.subSchemes || []);
    setProjects(app.projects || []);
    setSiteLogs(app.siteLogs || {});
    setGrievances(app.grievances || {});
    setFieldLogs(app.fieldLogs || []);
    setAmpEntries(app.ampEntries || []);
    setProposalEntries(app.proposalEntries || []);
    setMonthlyReports(app.monthlyReports || []);
    setSettings(app.settings || { mileage: 15 });
    setFileIndex(app.fileIndex || {});

    const allIds = Object.values(app.fileIndex || {}).flat();
    const metas = {};
    if (allIds.length) {
      for (const id of allIds) { const m = await storageGet('filemeta:' + id); if (m) metas[id] = m; }
    }
    setFileMetas(metas);
    setPhotoBlobs({});
    const initialExpanded = {};
    (app.schemes || DEFAULT_SCHEMES).forEach((s) => { initialExpanded[s.id] = true; });
    setExpanded(initialExpanded);
    setExpandedSub({});
    setSelectedProjectId(null);
    setSection('register');
    setActiveTab('documents');
  }

  async function switchSubDivision(id) {
    if (!id || id === activeSubDivisionId) return;
    skipSaveRef.current = true;
    setLoaded(false);
    await loadSubDivisionData(id);
    setActiveSubDivisionId(id);
    await storageSet('subdivisions-meta', { list: subDivisions, activeId: id });
    setLoaded(true);
    setTimeout(() => { skipSaveRef.current = false; }, 0);
  }

  async function addSubDivision(name) {
    const clean = name.trim(); if (!clean) return;
    const id = uid();
    const newList = [...subDivisions, { id, name: clean }];
    setSubDivisions(newList);
    skipSaveRef.current = true;
    setLoaded(false);
    await loadSubDivisionData(id);
    setActiveSubDivisionId(id);
    await storageSet('subdivisions-meta', { list: newList, activeId: id });
    setLoaded(true);
    setTimeout(() => { skipSaveRef.current = false; }, 0);
  }

  /* ------------------------------- load on mount ------------------------------ */

  useEffect(() => {
    (async () => {
      let meta = await storageGet('subdivisions-meta');
      if (!meta) {
        const legacy = await storageGet('appdata');
        const defaultId = uid();
        if (legacy) { await storageSet('appdata:' + defaultId, legacy); }
        meta = { list: [{ id: defaultId, name: 'Basta' }], activeId: defaultId };
        await storageSet('subdivisions-meta', meta);
      }
      setSubDivisions(meta.list || []);
      setActiveSubDivisionId(meta.activeId);
      await loadSubDivisionData(meta.activeId);
      setLoaded(true);
      setTimeout(() => { skipSaveRef.current = false; }, 0);
    })();
  }, []);

  /* --------------------------------- autosave -------------------------------- */

  useEffect(() => {
    if (skipSaveRef.current) return;
    if (!activeSubDivisionId) return;
    storageSet('appdata:' + activeSubDivisionId, {
      schemes, subSchemes, projects, siteLogs, grievances, fieldLogs,
      ampEntries, proposalEntries, monthlyReports, settings, fileIndex,
    });
  }, [schemes, subSchemes, projects, siteLogs, grievances, fieldLogs, ampEntries, proposalEntries, monthlyReports, settings, fileIndex, activeSubDivisionId]);

  /* ------------------------------- derived data ------------------------------- */

  const selectedProject = projects.find((p) => p.id === selectedProjectId) || null;
  const projectFileIds = selectedProjectId ? (fileIndex[selectedProjectId] || []) : [];
  const projectFiles = projectFileIds.map((id) => fileMetas[id]).filter(Boolean);

  /* ---------------------------------- actions --------------------------------- */

  function addScheme(name) {
    const clean = name.trim(); if (!clean) return;
    const id = clean.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + uid().slice(0, 4);
    setSchemes((prev) => [...prev, { id, name: clean }]);
    setExpanded((prev) => ({ ...prev, [id]: true }));
    setShowAddScheme(false);
  }

  function addSubScheme(schemeId, name) {
    const clean = name.trim(); if (!clean) return;
    const id = uid();
    setSubSchemes((prev) => [...prev, { id, schemeId, name: clean }]);
    setExpandedSub((prev) => ({ ...prev, [id]: true }));
  }
  function deleteSubScheme(id) {
    setProjects((prev) => prev.map((p) => (p.subSchemeId === id ? { ...p, subSchemeId: null } : p)));
    setSubSchemes((prev) => prev.filter((s) => s.id !== id));
  }

  function addProject(schemeId, subSchemeId, data) {
    const id = uid();
    const proj = {
      id, schemeId, subSchemeId: subSchemeId || null,
      name: data.name.trim(), type: data.type, location: data.location.trim(),
      year: data.year || currentFY(), status: 'Ongoing', constituency: data.constituency || CONSTITUENCIES[0],
    };
    setProjects((prev) => [...prev, proj]);
    setAddProjectTarget(null);
    setSelectedProjectId(id);
    setActiveTab('documents');
  }

  function updateProject(projectId, patch) {
    setProjects((prev) => prev.map((p) => (p.id === projectId ? { ...p, ...patch } : p)));
  }

  async function deleteProject(projectId) {
    const ids = fileIndex[projectId] || [];
    for (const id of ids) { await storageDelete('filemeta:' + id); await storageDelete('fileblob:' + id); }
    setFileIndex((prev) => { const n = { ...prev }; delete n[projectId]; return n; });
    setFileMetas((prev) => { const n = { ...prev }; ids.forEach((id) => delete n[id]); return n; });
    setSiteLogs((prev) => { const n = { ...prev }; delete n[projectId]; return n; });
    setGrievances((prev) => { const n = { ...prev }; delete n[projectId]; return n; });
    setProjects((prev) => prev.filter((p) => p.id !== projectId));
    if (selectedProjectId === projectId) setSelectedProjectId(null);
  }

  async function saveFile(scopeKey, sect, meta, dataUrl) {
    const approxBytes = Math.ceil(dataUrl.length * 0.75);
    if (approxBytes > MAX_FILE_BYTES) {
      alert('That file is too large to store here (limit ~3.5 MB). Please use a smaller or compressed file.');
      return null;
    }
    const id = uid();
    const fullMeta = { id, projectId: scopeKey, section: sect, size: approxBytes, createdAt: Date.now(), ...meta };
    const ok1 = await storageSet('filemeta:' + id, fullMeta);
    const ok2 = await storageSet('fileblob:' + id, dataUrl);
    if (!ok1 || !ok2) { alert('Could not save the file. Please try again.'); return null; }
    setFileMetas((prev) => ({ ...prev, [id]: fullMeta }));
    setFileIndex((prev) => ({ ...prev, [scopeKey]: [...(prev[scopeKey] || []), id] }));
    return id;
  }

  async function deleteFile(id, scopeKey) {
    await storageDelete('filemeta:' + id);
    await storageDelete('fileblob:' + id);
    setFileMetas((prev) => { const n = { ...prev }; delete n[id]; return n; });
    setFileIndex((prev) => ({ ...prev, [scopeKey]: (prev[scopeKey] || []).filter((x) => x !== id) }));
    setPhotoBlobs((prev) => { const n = { ...prev }; delete n[id]; return n; });
  }

  async function openFile(meta) {
    setBusyMsg('Opening file…');
    const dataUrl = await storageGet('fileblob:' + meta.id);
    setBusyMsg('');
    if (!dataUrl) { alert('Could not load this file.'); return; }
    setViewerFile({ meta, dataUrl });
  }
  async function openFileById(id) {
    const meta = fileMetas[id];
    if (!meta) return;
    await openFile(meta);
  }

  async function uploadDocuments(projectId, sect, category, fileList, extra) {
    setBusyMsg('Uploading…');
    for (const file of Array.from(fileList)) {
      try {
        const dataUrl = await loadAnyFile(file);
        await saveFile(projectId, sect, {
          category: category || 'Other', name: file.name, mimeType: file.type || 'application/octet-stream',
          date: (extra && extra.date) || todayStr(), notes: (extra && extra.notes) || '',
        }, dataUrl);
      } catch (e) { console.error(e); }
    }
    setBusyMsg('');
  }

  async function loadPhotosForProject(projectId) {
    const ids = (fileIndex[projectId] || []).filter((id) => fileMetas[id] && fileMetas[id].section === 'photo');
    const missing = ids.filter((id) => !photoBlobs[id]);
    if (!missing.length) return;
    const updates = {};
    for (const id of missing) { const d = await storageGet('fileblob:' + id); if (d) updates[id] = d; }
    setPhotoBlobs((prev) => ({ ...prev, ...updates }));
  }

  useEffect(() => {
    if (selectedProjectId && activeTab === 'photos') loadPhotosForProject(selectedProjectId);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selectedProjectId, activeTab, fileIndex]);

  async function capturePhotos(projectId, fileList) {
    const filesArr = Array.from(fileList || []);
    if (!filesArr.length) return { savedCount: 0, locOk: false };
    setBusyMsg('Getting location…');
    let loc = { ok: false, reason: 'Location check failed.' };
    try { loc = await getLocation(); } catch (locErr) { console.error('getLocation threw:', locErr); }
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    const project = projects.find((p) => p.id === projectId);
    const lines = loc.ok
      ? [`${dateStr}  ${timeStr}`, `${loc.lat.toFixed(6)}, ${loc.lng.toFixed(6)}`, project ? project.name : '']
      : [`${dateStr}  ${timeStr}`, 'Location unavailable', project ? project.name : ''];

    setBusyMsg('Saving photo…');
    let savedCount = 0;
    const failures = [];
    for (const file of filesArr) {
      try {
        if (!file || !file.size) { failures.push((file && file.name) || 'photo (empty file)'); continue; }
        const raw = await loadAnyFile(file);
        let dataToSave = raw;
        let mime = file.type || 'image/jpeg';
        try {
          dataToSave = await stampAndCompressImage(raw, lines);
          mime = 'image/jpeg';
        } catch (stampErr) {
          console.error('Stamping failed, saving original photo instead:', stampErr);
          // fall back to the original, un-stamped photo rather than losing it entirely
        }
        const id = await saveFile(projectId, 'photo', {
          category: 'Photo', name: file.name || `photo-${uid()}.jpg`, mimeType: mime, date: todayStr(),
          notes: loc.ok ? `${loc.lat.toFixed(6)}, ${loc.lng.toFixed(6)}` : (loc.reason || 'Location unavailable'),
        }, dataToSave);
        if (id) savedCount++; else failures.push(file.name || 'photo');
      } catch (e) {
        console.error(e);
        failures.push(file.name || 'photo');
      }
    }
    setBusyMsg('');
    loadPhotosForProject(projectId);
    if (failures.length) {
      alert(`${savedCount} photo${savedCount !== 1 ? 's' : ''} saved. ${failures.length} failed to save (${failures.join(', ')}). Please try again, or check available storage on your device.`);
    }
    return { savedCount, locOk: loc.ok, locReason: loc.reason };
  }

  async function addSiteLog(projectId, entry) {
    let geo = { ok: false };
    if (entry.useLocation) { setBusyMsg('Getting location…'); geo = await getLocation(); setBusyMsg(''); if (!geo.ok && geo.reason) alert(geo.reason); }
    const log = {
      id: uid(), date: entry.date || todayStr(), visitedBy: entry.visitedBy || '', notes: entry.notes || '',
      weather: entry.weather || '', lat: geo.ok ? geo.lat : null, lng: geo.ok ? geo.lng : null, createdAt: Date.now(),
    };
    setSiteLogs((prev) => ({ ...prev, [projectId]: [log, ...(prev[projectId] || [])] }));
  }
  function deleteSiteLog(projectId, logId) {
    setSiteLogs((prev) => ({ ...prev, [projectId]: (prev[projectId] || []).filter((l) => l.id !== logId) }));
  }

  function addGrievance(projectId, entry) {
    const g = { id: uid(), status: 'Pending', redressal: '', resolvedDate: null, createdAt: Date.now(), ...entry };
    setGrievances((prev) => ({ ...prev, [projectId]: [g, ...(prev[projectId] || [])] }));
  }
  function updateGrievance(projectId, id, patch) {
    setGrievances((prev) => ({ ...prev, [projectId]: (prev[projectId] || []).map((g) => (g.id === id ? { ...g, ...patch } : g)) }));
  }
  function deleteGrievance(projectId, id) {
    setGrievances((prev) => ({ ...prev, [projectId]: (prev[projectId] || []).filter((g) => g.id !== id) }));
  }

  function addFieldLog(entry) { setFieldLogs((prev) => [{ id: uid(), createdAt: Date.now(), ...entry }, ...prev]); }
  function deleteFieldLog(id) { setFieldLogs((prev) => prev.filter((l) => l.id !== id)); }

  async function addProposalOrAmp(kind, meta, fileList) {
    setBusyMsg('Uploading…');
    const fileIds = [];
    for (const file of Array.from(fileList)) {
      try {
        const dataUrl = await loadAnyFile(file);
        const id = await saveFile(kind, kind, {
          category: kind === 'amp' ? 'AMP' : 'Proposal', name: file.name, mimeType: file.type || 'application/octet-stream',
          date: todayStr(), notes: meta.notes || '',
        }, dataUrl);
        if (id) fileIds.push(id);
      } catch (e) { console.error(e); }
    }
    const entry = { id: uid(), createdAt: Date.now(), fileIds, ...meta };
    if (kind === 'amp') setAmpEntries((prev) => [entry, ...prev]);
    else setProposalEntries((prev) => [entry, ...prev]);
    setBusyMsg('');
  }

  async function deleteEntryWithFiles(kind, entry) {
    for (const fid of entry.fileIds || []) { await storageDelete('filemeta:' + fid); await storageDelete('fileblob:' + fid); }
    setFileMetas((prev) => { const n = { ...prev }; (entry.fileIds || []).forEach((fid) => delete n[fid]); return n; });
    setFileIndex((prev) => ({ ...prev, [kind]: (prev[kind] || []).filter((x) => !(entry.fileIds || []).includes(x)) }));
  }
  async function deleteProposal(id) {
    const e = proposalEntries.find((x) => x.id === id);
    if (e) await deleteEntryWithFiles('proposal', e);
    setProposalEntries((prev) => prev.filter((x) => x.id !== id));
  }
  async function deleteAmp(id) {
    const e = ampEntries.find((x) => x.id === id);
    if (e) await deleteEntryWithFiles('amp', e);
    setAmpEntries((prev) => prev.filter((x) => x.id !== id));
  }

  async function addMonthlyReport(categoryId, categoryLabel, month, fileList) {
    setBusyMsg('Uploading…');
    const fileIds = [];
    for (const file of Array.from(fileList)) {
      try {
        const dataUrl = await loadAnyFile(file);
        const id = await saveFile('monthly', 'monthly', {
          category: categoryLabel, name: file.name, mimeType: file.type || 'application/octet-stream', date: todayStr(), notes: month,
        }, dataUrl);
        if (id) fileIds.push(id);
      } catch (e) { console.error(e); }
    }
    setMonthlyReports((prev) => [{ id: uid(), categoryId, categoryLabel, month, fileIds, createdAt: Date.now() }, ...prev]);
    setBusyMsg('');
  }
  async function deleteMonthlyReport(id) {
    const e = monthlyReports.find((x) => x.id === id);
    if (e) await deleteEntryWithFiles('monthly', e);
    setMonthlyReports((prev) => prev.filter((x) => x.id !== id));
  }

  function downloadAbstract() {
    const wb = buildAbstractWorkbook({ schemes, subSchemes, projects, fileIndex, fileMetas, siteLogs, grievances });
    downloadWorkbook(wb, `scheme-abstract-${todayStr()}.xlsx`);
  }

  /* --------------------------------- rendering -------------------------------- */

  if (!loaded) {
    return (
      <div style={{ fontFamily: FONT_SANS, background: C.paper, minHeight: 480, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.inkSoft }}>
        <style>{FONT_IMPORT}</style>
        <Loader2 size={20} className="animate-spin" style={{ marginRight: 8 }} />
        Loading register…
      </div>
    );
  }

  return (
    <div style={{ fontFamily: FONT_SANS, background: C.paper, color: C.ink, minHeight: 600, display: 'flex', flexDirection: 'column' }}>
      <style>{FONT_IMPORT}{GLOBAL_CSS}</style>
      <datalist id="fy-options">{fyOptionsList().map((y) => <option key={y} value={y} />)}</datalist>
      <div style={{ height: 3, background: C.rust }} />

      {/* ---- header ---- */}
      <div style={{ background: C.sidebar, padding: '16px 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', boxShadow: '0 2px 8px rgba(11,61,98,0.25)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <button onClick={() => setSidebarOpen((s) => !s)} className="md-hide icon-btn" style={{ color: '#fff' }}><Menu size={20} /></button>
          <div>
            <div style={{ fontSize: 19, fontWeight: 700, letterSpacing: '-0.01em', color: '#fff' }}>Site &amp; Project Register</div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: 'rgba(255,255,255,0.72)', marginTop: 2 }}>
              {schemes.length} scheme{schemes.length !== 1 ? 's' : ''} · {projects.length} project{projects.length !== 1 ? 's' : ''}
            </div>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          {busyMsg && (
            <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: '#FDE68A', display: 'flex', alignItems: 'center', gap: 6 }}>
              <Loader2 size={13} className="animate-spin" /> {busyMsg}
            </div>
          )}
          <SubDivisionSwitcher subDivisions={subDivisions} activeId={activeSubDivisionId} onSwitch={switchSubDivision} onAdd={addSubDivision} />
        </div>
      </div>

      {/* ---- section nav ---- */}
      <div style={{ display: 'flex', gap: 2, padding: '0 18px', borderBottom: `1px solid ${C.line}`, background: C.paper, flexWrap: 'wrap' }}>
        {NAV_SECTIONS.map((sec) => {
          const active = section === sec.id;
          const Icon = sec.icon;
          return (
            <button key={sec.id} onClick={() => setSection(sec.id)} className={`nav-btn ${active ? 'nav-btn-active' : ''}`}>
              <Icon size={14} /> {sec.label}
            </button>
          );
        })}
      </div>

      <div style={{ display: 'flex', flex: 1, minHeight: 560 }}>
        {section === 'register' ? (
          <>
            {/* ---- sidebar ---- */}
            <div className="sidebar" style={{ width: 280, flexShrink: 0, borderRight: `1px solid ${C.line}`, background: C.paperDark, padding: '14px 10px', display: sidebarOpen ? 'block' : undefined, overflowY: 'auto' }}>
              {schemes.map((scheme, schemeIdx) => {
                const sColor = schemeColor(schemeIdx);
                const schemeSubs = subSchemes.filter((ss) => ss.schemeId === scheme.id);
                const isOpen = !!expanded[scheme.id];
                const directProjects = projects.filter((p) => p.schemeId === scheme.id && !p.subSchemeId);
                const totalInScheme = projects.filter((p) => p.schemeId === scheme.id).length;

                return (
                  <div key={scheme.id} style={{ marginBottom: 6 }}>
                    <button onClick={() => { setExpanded((prev) => ({ ...prev, [scheme.id]: !prev[scheme.id] })); setSelectedSchemeId(scheme.id); setSelectedProjectId(null); }}
                      className="row-hover" style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none', cursor: 'pointer', padding: '7px 6px', textAlign: 'left' }}>
                      {isOpen ? <ChevronDown size={15} color={C.inkSoft} /> : <ChevronRight size={15} color={C.inkSoft} />}
                      <span style={{ width: 9, height: 9, borderRadius: 3, background: sColor, flexShrink: 0 }} />
                      <FolderOpen size={14} color={sColor} />
                      <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 13, color: sColor, letterSpacing: '0.02em' }}>{scheme.name}</span>
                      <span style={{ marginLeft: 'auto', fontFamily: FONT_MONO, fontSize: 11, color: C.khaki }}>{totalInScheme}</span>
                    </button>

                    {isOpen && (
                      <div style={{ paddingLeft: 22, borderLeft: `1px solid ${C.line}`, marginLeft: 12 }}>
                        {schemeSubs.map((sub) => {
                          const subOpen = !!expandedSub[sub.id];
                          const subProjects = projects.filter((p) => p.subSchemeId === sub.id);
                          const isAddingHere = addProjectTarget && addProjectTarget.schemeId === scheme.id && addProjectTarget.subSchemeId === sub.id;
                          return (
                            <div key={sub.id} style={{ marginBottom: 4 }}>
                              <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                                <button onClick={() => setExpandedSub((prev) => ({ ...prev, [sub.id]: !prev[sub.id] }))}
                                  className="row-hover" style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none', cursor: 'pointer', padding: '5px 6px', textAlign: 'left', minWidth: 0 }}>
                                  {subOpen ? <ChevronDown size={13} color={C.navySoft} /> : <ChevronRight size={13} color={C.navySoft} />}
                                  <Folder size={12} color={C.navySoft} />
                                  <span style={{ fontSize: 12.5, fontWeight: 600, color: C.ink, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{sub.name}</span>
                                  <span style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: C.khaki }}>{subProjects.length}</span>
                                </button>
                                <ConfirmDelete onConfirm={() => deleteSubScheme(sub.id)} label="Delete sub-scheme" />
                              </div>

                              {subOpen && (
                                <div style={{ paddingLeft: 20 }}>
                                  {groupProjectsByYear(subProjects).map(([yr, plist]) => (
                                    <div key={yr} style={{ marginBottom: 4 }}>
                                      {subProjects.length > 3 && <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: C.khaki, padding: '3px 6px 1px' }}>{yr === 'Unspecified' ? 'NO YEAR' : `FY ${yr}`}</div>}
                                      {plist.map((proj) => (
                                        <ProjectRow key={proj.id} proj={proj} selected={selectedProjectId === proj.id}
                                          onSelect={() => { setSelectedProjectId(proj.id); setActiveTab('documents'); setSidebarOpen(false); }} />
                                      ))}
                                    </div>
                                  ))}
                                  {isAddingHere ? (
                                    <AddProjectForm schemeName={scheme.name} onCancel={() => setAddProjectTarget(null)} onSave={(data) => addProject(scheme.id, sub.id, data)} />
                                  ) : (
                                    <button onClick={() => setAddProjectTarget({ schemeId: scheme.id, subSchemeId: sub.id })}
                                      style={{ display: 'flex', alignItems: 'center', gap: 5, marginTop: 3, padding: '5px 6px', background: 'none', border: 'none', cursor: 'pointer', color: C.rust, fontSize: 12, fontWeight: 500 }}>
                                      <Plus size={12} /> Add project
                                    </button>
                                  )}
                                </div>
                              )}
                            </div>
                          );
                        })}

                        {(directProjects.length > 0 || schemeSubs.length === 0) && (
                          <div style={{ marginTop: schemeSubs.length ? 8 : 0 }}>
                            {schemeSubs.length > 0 && directProjects.length > 0 && (
                              <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: C.khaki, padding: '2px 6px', marginBottom: 2 }}>GENERAL</div>
                            )}
                            {groupProjectsByYear(directProjects).map(([yr, plist]) => (
                              <div key={yr} style={{ marginBottom: 4 }}>
                                {directProjects.length > 3 && <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: C.khaki, padding: '3px 6px 1px' }}>{yr === 'Unspecified' ? 'NO YEAR' : `FY ${yr}`}</div>}
                                {plist.map((proj) => (
                                  <ProjectRow key={proj.id} proj={proj} selected={selectedProjectId === proj.id}
                                    onSelect={() => { setSelectedProjectId(proj.id); setActiveTab('documents'); setSidebarOpen(false); }} />
                                ))}
                              </div>
                            ))}
                            {addProjectTarget && addProjectTarget.schemeId === scheme.id && !addProjectTarget.subSchemeId ? (
                              <AddProjectForm schemeName={scheme.name} onCancel={() => setAddProjectTarget(null)} onSave={(data) => addProject(scheme.id, null, data)} />
                            ) : (
                              <button onClick={() => setAddProjectTarget({ schemeId: scheme.id, subSchemeId: null })}
                                style={{ display: 'flex', alignItems: 'center', gap: 5, marginTop: 4, padding: '6px 6px', background: 'none', border: 'none', cursor: 'pointer', color: C.rust, fontSize: 12.5, fontWeight: 500 }}>
                                <Plus size={13} /> Add project{schemeSubs.length ? ' (no sub-scheme)' : ''}
                              </button>
                            )}
                          </div>
                        )}

                        <div style={{ marginTop: 8 }}>
                          <SubSchemeAdder onSave={(name) => addSubScheme(scheme.id, name)} />
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}

              {showAddScheme ? (
                <AddSchemeForm onCancel={() => setShowAddScheme(false)} onSave={addScheme} />
              ) : (
                <button onClick={() => setShowAddScheme(true)} className="btn-ghost" style={{ marginTop: 10, width: '100%', justifyContent: 'center', borderStyle: 'dashed' }}>
                  <Plus size={14} style={{ marginRight: 5 }} /> Add scheme
                </button>
              )}
            </div>

            {/* ---- main ---- */}
            <div style={{ flex: 1, padding: '18px 22px', minWidth: 0 }}>
              {selectedProject ? (
                <ProjectPanel
                  project={selectedProject}
                  scheme={schemes.find((s) => s.id === selectedProject.schemeId)}
                  subScheme={subSchemes.find((s) => s.id === selectedProject.subSchemeId)}
                  activeTab={activeTab} setActiveTab={setActiveTab}
                  onDeleteProject={() => deleteProject(selectedProject.id)}
                  onUpdateProject={(patch) => updateProject(selectedProject.id, patch)}
                  files={projectFiles}
                  onUploadDocuments={uploadDocuments} onOpenFile={openFile} onDeleteFile={deleteFile}
                  photoBlobs={photoBlobs} onCapturePhotos={capturePhotos}
                  siteLogs={siteLogs[selectedProject.id] || []} onAddSiteLog={(entry) => addSiteLog(selectedProject.id, entry)} onDeleteSiteLog={(logId) => deleteSiteLog(selectedProject.id, logId)}
                  grievances={grievances[selectedProject.id] || []} onAddGrievance={(entry) => addGrievance(selectedProject.id, entry)}
                  onUpdateGrievance={(id, patch) => updateGrievance(selectedProject.id, id, patch)} onDeleteGrievance={(id) => deleteGrievance(selectedProject.id, id)}
                />
              ) : selectedSchemeId && schemes.find((s) => s.id === selectedSchemeId) ? (
                <SchemeOverview
                  scheme={schemes.find((s) => s.id === selectedSchemeId)}
                  subSchemes={subSchemes} projects={projects}
                  onSelectProject={(id) => setSelectedProjectId(id)}
                />
              ) : (
                <EmptyState hasProjects={projects.length > 0} />
              )}
            </div>
          </>
        ) : (
          <div style={{ flex: 1, padding: '18px 22px', minWidth: 0 }}>
            {section === 'abstract' && (
              <AbstractSection schemes={schemes} subSchemes={subSchemes} projects={projects} onDownload={downloadAbstract} />
            )}
            {section === 'monthly' && (
              <MonthlyProgressSection schemes={schemes} entries={monthlyReports} onAdd={addMonthlyReport} onOpenFile={openFileById} onDelete={deleteMonthlyReport} />
            )}
            {section === 'fieldlog' && (
              <FieldLogSection logs={fieldLogs} mileage={settings.mileage} onSetMileage={(m) => setSettings((s) => ({ ...s, mileage: m }))} onAdd={addFieldLog} onDelete={deleteFieldLog} />
            )}
            {section === 'proposals' && (
              <ProposalsSection kind="proposal" entries={proposalEntries} schemes={schemes} subSchemes={subSchemes}
                onAdd={(meta, files) => addProposalOrAmp('proposal', meta, files)} onOpenFile={openFileById} onDelete={deleteProposal} />
            )}
            {section === 'amp' && (
              <ProposalsSection kind="amp" entries={ampEntries} schemes={schemes} subSchemes={subSchemes}
                onAdd={(meta, files) => addProposalOrAmp('amp', meta, files)} onOpenFile={openFileById} onDelete={deleteAmp} />
            )}
          </div>
        )}
      </div>

      {viewerFile && <FileViewerModal meta={viewerFile.meta} dataUrl={viewerFile.dataUrl} onClose={() => setViewerFile(null)} />}

      <style>{`
        @media (max-width: 780px) {
          .sidebar { display: ${sidebarOpen ? 'block' : 'none'}; position: fixed; top: 107px; left: 0; bottom: 0; z-index: 30; box-shadow: 2px 0 12px rgba(0,0,0,0.15); }
          .md-hide { display: inline-flex !important; }
        }
        @media (min-width: 781px) {
          .sidebar { display: block; }
          .md-hide { display: none; }
        }
        input::placeholder, textarea::placeholder { color: ${C.khaki}; }
      `}</style>
    </div>
  );
}

/* ------------------------------- small components ---------------------------- */

function EmptyState({ hasProjects }) {
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', color: C.inkSoft, textAlign: 'center', padding: 40 }}>
      <FolderOpen size={34} color={C.khaki} />
      <div style={{ fontSize: 16, fontWeight: 600, marginTop: 14, color: C.ink }}>{hasProjects ? 'Select a project' : 'No projects yet'}</div>
      <div style={{ fontSize: 13.5, marginTop: 6, maxWidth: 340 }}>
        {hasProjects
          ? 'Choose a project from the register on the left to see its documents, progress reports, photographs, site visit log and grievances.'
          : 'Open a scheme in the left panel, add a sub-scheme if it has one (like MMSY), then add your first project — a road, bridge or building work.'}
      </div>
    </div>
  );
}

function SchemeOverview({ scheme, subSchemes, projects, onSelectProject }) {
  const schemeProjects = projects.filter((p) => p.schemeId === scheme.id);
  const grouped = groupProjectsByYear(schemeProjects);
  return (
    <div>
      <div style={{ fontSize: 20, fontWeight: 700 }}>{scheme.name} — All Projects</div>
      <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.inkSoft, marginTop: 4 }}>
        {schemeProjects.length} project{schemeProjects.length !== 1 ? 's' : ''}{grouped.length ? ` across ${grouped.length} financial year${grouped.length !== 1 ? 's' : ''}` : ''}
      </div>

      {schemeProjects.length === 0 ? (
        <div style={{ color: C.khaki, fontSize: 13, marginTop: 24 }}>No projects filed under this scheme yet — use "+ Add project" in the left panel to start.</div>
      ) : (
        <div style={{ marginTop: 18 }}>
          {grouped.map(([yr, plist]) => (
            <div key={yr} style={{ marginBottom: 22 }}>
              <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 13, color: C.navy, borderBottom: `1px solid ${C.line}`, paddingBottom: 5, marginBottom: 10 }}>
                {yr === 'Unspecified' ? 'No financial year specified' : `FY ${yr}`} <span style={{ color: C.khaki, fontWeight: 500 }}>· {plist.length}</span>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: 10 }}>
                {plist.map((proj) => {
                  const sub = subSchemes.find((s) => s.id === proj.subSchemeId);
                  const TypeIcon = PROJECT_TYPE_ICONS[proj.type] || HelpCircle;
                  const done = proj.status === 'Completed';
                  return (
                    <button key={proj.id} onClick={() => onSelectProject(proj.id)} className="card row-hover"
                      style={{ textAlign: 'left', cursor: 'pointer', padding: 12, display: 'flex', flexDirection: 'column', gap: 6 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <TypeIcon size={15} color={done ? C.success : C.warning} style={{ flexShrink: 0 }} />
                        <span style={{ fontWeight: 600, fontSize: 13.5, color: C.ink }}>{proj.name}</span>
                      </div>
                      <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: C.inkSoft }}>
                        {sub ? `${sub.name} · ` : ''}{proj.type}{proj.location ? ` · ${proj.location}` : ''}
                      </div>
                      <span className={`status-pill ${done ? 'status-pill-done' : 'status-pill-ongoing'}`} style={{ alignSelf: 'flex-start', fontSize: 10.5, padding: '3px 8px' }}>
                        {done ? 'Completed' : 'Ongoing'}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ProjectRow({ proj, selected, onSelect }) {
  const TypeIcon = PROJECT_TYPE_ICONS[proj.type] || HelpCircle;
  const done = proj.status === 'Completed';
  return (
    <button onClick={onSelect} className="row-hover" style={{
      display: 'flex', alignItems: 'center', gap: 8, width: '100%', textAlign: 'left', padding: '7px 8px', marginTop: 2,
      background: selected ? C.card : 'none', border: selected ? `1px solid ${C.line}` : '1px solid transparent', cursor: 'pointer',
    }}>
      <TypeIcon size={13} color={done ? C.success : C.warning} style={{ flexShrink: 0 }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13.5, fontWeight: 500, color: C.ink, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{proj.name}</div>
        <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: C.inkSoft, marginTop: 1 }}>
          {proj.type}{proj.year ? ` · FY ${proj.year}` : ''}{proj.location ? ` · ${proj.location}` : ''}
        </div>
      </div>
      <span title={done ? 'Completed' : 'Ongoing'} style={{ width: 7, height: 7, borderRadius: '50%', background: done ? C.success : C.warning, flexShrink: 0 }} />
    </button>
  );
}

function SubSchemeAdder({ onSave }) {
  const [open, setOpen] = useState(false);
  const [val, setVal] = useState('');
  if (!open) {
    return (
      <button onClick={() => setOpen(true)} style={{ fontSize: 10.5, fontFamily: FONT_MONO, color: C.rust, background: 'none', border: `1px dashed ${C.rust}`, borderRadius: 20, padding: '3px 9px', cursor: 'pointer' }}>
        + Add sub-scheme
      </button>
    );
  }
  function commit() { if (val.trim()) onSave(val); setVal(''); setOpen(false); }
  return (
    <span style={{ display: 'inline-flex', gap: 4 }}>
      <input autoFocus value={val} onChange={(e) => setVal(e.target.value)}
        onKeyDown={(e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { setVal(''); setOpen(false); } }}
        className="input" style={{ fontSize: 11, padding: '3px 7px', width: 100 }} placeholder="name" />
      <button onClick={commit} style={{ fontSize: 10.5, color: C.navy, background: 'none', border: 'none', cursor: 'pointer', fontWeight: 600 }}>Add</button>
    </span>
  );
}

function AddSchemeForm({ onCancel, onSave }) {
  const [name, setName] = useState('');
  return (

  const filtered = filterCat === 'All' ? files : files.filter((f) => f.category === filterCat);

  return (
    <div>
      <div className="card">
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'flex-end' }}>

            <div><label style={labelStyle}>Category</label>

            </div>
          )}
          <div><label style={labelStyle}>Date</label><input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="input" style={{ width: 145 }} /></div>
          <div style={{ flex: 1, minWidth: 160 }}>
            <label style={labelStyle}>{isProgress ? 'Report period / note' : 'Reference / note (optional)'}</label>

          </div>
          <div>
            <input ref={inputRef} type="file" multiple accept={ACCEPT_DOC} style={{ display: 'none' }}
              onChange={(e) => { if (e.target.files && e.target.files.length) onUpload(projectId, section, isProgress ? 'Progress Report' : category, e.target.files, { date, notes }); e.target.value = ''; }} />

        </div>
        <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 8 }}>PDF, image, or Excel · up to ~3.5 MB per file · view opens in-app, no download needed</div>

      {!isProgress && (
        <div style={{ display: 'flex', gap: 6, marginTop: 14, flexWrap: 'wrap' }}>

              padding: '4px 10px', borderRadius: 20, fontSize: 12, cursor: 'pointer',

            }}>{c}</button>

        {sorted.length === 0 ? (
          <div style={{ color: C.khaki, fontSize: 13, padding: '20px 4px' }}>No files here yet. Upload one above to start this file.</div>

          sorted.map((f) => {
            const Icon = fileIcon(f.mimeType);
            return (
              <div key={f.id} className="row-hover" style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 8px', borderBottom: `1px solid ${C.lineSoft}` }}>
                <Icon size={17} color={C.navy} />

                  <div style={{ fontSize: 13.5, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.name}</div>
                  <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: C.inkSoft, marginTop: 2 }}>
                    {!isProgress && <span>{f.category} · </span>}{fmtDate(f.date)}{f.notes ? ` · ${f.notes}` : ''} · {fmtBytes(f.size)}
                  </div>
                </div>
                <button onClick={() => onOpenFile(f)} className="icon-btn" title="View"><Eye size={15} /></button>
                <ConfirmDelete onConfirm={() => onDeleteFile(f.id, projectId)} label="Delete file" />
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

function PhotosTab({ projectId, files, photoBlobs, onCapturePhotos, onDeleteFile }) {
  const cameraRef = useRef(null);
  const galleryRef = useRef(null);
  const sorted = [...files].sort((a, b) => b.createdAt - a.createdAt);
  const [preview, setPreview] = useState(null);
  const [locStatus, setLocStatus] = useState(null); // null | 'checking' | {ok,...}
  const [capturing, setCapturing] = useState(false);

  async function checkLocation() {
    setLocStatus('checking');
    const res = await getLocation();
    setLocStatus(res);
  }

  async function handleCapture(fileList) {
    setCapturing(true);
    try {
      const result = await onCapturePhotos(projectId, fileList);
      if (result && result.savedCount === 0) {
        alert('No photo was saved. This can happen if the camera app returned no image, or if the file was empty. Please try again — if it keeps happening, try "Upload from gallery" instead: take the photo with your phone\'s normal camera app first, then attach it from there.');
      }
    } catch (e) {
      console.error('Photo capture failed:', e);
      alert('Something went wrong saving the photo: ' + (e && e.message ? e.message : 'unknown error') + '. Please try again, or use "Upload from gallery" as a workaround.');
    }
    setCapturing(false);
  }

  return (
    <div>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
        <input ref={cameraRef} type="file" accept="image/*" capture="environment" style={{ display: 'none' }}
          onChange={(e) => { if (e.target.files && e.target.files.length) handleCapture(e.target.files); e.target.value = ''; }} />
        <input ref={galleryRef} type="file" accept="image/*" multiple style={{ display: 'none' }}
          onChange={(e) => { if (e.target.files && e.target.files.length) handleCapture(e.target.files); e.target.value = ''; }} />
        <button onClick={() => cameraRef.current.click()} className="btn-primary" disabled={capturing}>
          {capturing ? <Loader2 size={13} className="animate-spin" style={{ marginRight: 5 }} /> : <Camera size={13} style={{ marginRight: 5 }} />} Take photo
        </button>
        <button onClick={() => galleryRef.current.click()} className="btn-ghost" disabled={capturing}><Upload size={13} style={{ marginRight: 5 }} /> Upload from gallery</button>
        <button onClick={checkLocation} className="btn-ghost" style={{ fontSize: 11.5, padding: '6px 10px' }}>
          <MapPin size={12} style={{ marginRight: 4 }} /> Check location access
        </button>
      </div>
      <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 8 }}>
        The date, time and GPS coordinates are stamped onto the photo itself right after it's taken (not shown live while the camera is open) — you'll see the stamp in the bottom-left corner once the photo appears below.
      </div>
      {locStatus === 'checking' && (
        <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 4, display: 'flex', alignItems: 'center', gap: 5 }}><Loader2 size={12} className="animate-spin" /> Checking location access…</div>
      )}
      {locStatus && locStatus !== 'checking' && locStatus.ok && (
        <div style={{ fontSize: 11.5, color: C.success, marginTop: 4 }}>✓ Location access is working ({locStatus.lat.toFixed(5)}, {locStatus.lng.toFixed(5)}). New photos will be geotagged.</div>
      )}
      {locStatus && locStatus !== 'checking' && !locStatus.ok && (
        <div style={{ fontSize: 11.5, color: C.danger, marginTop: 4 }}>{locStatus.reason || 'Location unavailable.'} Photos will still save, just without GPS coordinates.</div>
      )}

      {sorted.length === 0 ? (
        <div style={{ color: C.khaki, fontSize: 13, padding: '24px 4px' }}>No photographs filed for this project yet.</div>
      ) : (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: 10, marginTop: 16 }}>
          {sorted.map((f) => (
            <div key={f.id} style={{ border: `1px solid ${C.line}`, borderRadius: 8, overflow: 'hidden', background: C.card, boxShadow: '0 1px 3px rgba(33,43,33,0.06)' }}>
              <div onClick={() => photoBlobs[f.id] && setPreview({ meta: f, dataUrl: photoBlobs[f.id] })}
                style={{ width: '100%', height: 110, background: C.lineSoft, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                {photoBlobs[f.id] ? <img src={photoBlobs[f.id]} alt={f.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : <Loader2 size={16} className="animate-spin" color={C.khaki} />}
              </div>
              <div style={{ padding: '6px 8px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: C.inkSoft }}>{fmtDate(f.date)}</div>
                <ConfirmDelete onConfirm={() => onDeleteFile(f.id, projectId)} label="Delete photo" />
              </div>
            </div>
          ))}
        </div>
      )}

      {preview && <FileViewerModal meta={preview.meta} dataUrl={preview.dataUrl} onClose={() => setPreview(null)} />}
    </div>
  );
}

        <div style={{ marginTop: 10 }}>
          <label style={labelStyle}>Site observation</label>

              </div>
            </div>
          ))
        )}
      </div>
    </div>
