                  <select value={g.status}
                    onChange={(e) => onUpdate(g.id, { status: e.target.value, resolvedDate: e.target.value === 'Resolved' ? (g.resolvedDate || todayStr()) : null })}
                    style={{ fontSize: 11.5, fontFamily: FONT_MONO, padding: '3px 6px', border: `1px solid ${g.status === 'Resolved' ? C.success : C.warning}`, borderRadius: 5, color: g.status === 'Resolved' ? C.success : C.warning, background: '#fff' }}>
                    {GRIEVANCE_STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
                  </select>
                  <ConfirmDelete onConfirm={() => onDelete(g.id)} label="Delete grievance" />
                </div>
              </div>
              <div style={{ fontSize: 13.5, marginTop: 4 }}>{g.details}</div>
              {g.contact && <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: C.inkSoft, marginTop: 3 }}>Contact: {g.contact}</div>}
              <div style={{ marginTop: 6 }}>
                <input defaultValue={g.redressal || ''} placeholder="Redressal action taken…" onBlur={(e) => onUpdate(g.id, { redressal: e.target.value })} className="input" style={{ fontSize: 12.5 }} />
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

function FieldLogSection({ logs, mileage, onSetMileage, onAdd, onDelete }) {
  const [date, setDate] = useState(todayStr());
  const [vehicleNo, setVehicleNo] = useState('');
  const [startKm, setStartKm] = useState('');
  const [endKm, setEndKm] = useState('');
  const [purpose, setPurpose] = useState('');

  const distance = (startKm !== '' && endKm !== '' && !isNaN(startKm) && !isNaN(endKm)) ? Math.max(0, Number(endKm) - Number(startKm)) : null;
  const fuel = distance != null && mileage > 0 ? distance / mileage : null;

  function submit() {
    if (distance == null || !purpose.trim()) return;
    onAdd({ date, vehicleNo, startKm: Number(startKm), endKm: Number(endKm), distance, mileage, fuelUsed: fuel, purpose });
    setStartKm(''); setEndKm(''); setPurpose('');
  }

  const sorted = [...logs].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  const totalDistance = logs.reduce((s, l) => s + (l.distance || 0), 0);
  const totalFuel = logs.reduce((s, l) => s + (l.fuelUsed || 0), 0);

  return (
    <div>
      <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>Field Visit Log</div>
      <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.inkSoft, marginBottom: 16 }}>
        {logs.length} trip{logs.length !== 1 ? 's' : ''} logged · {totalDistance.toFixed(0)} km · {totalFuel.toFixed(1)} L fuel
      </div>

      <div className="card">
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'flex-end' }}>
          <div><label style={labelStyle}>Date</label><input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="input" style={{ width: 145 }} /></div>
          <div><label style={labelStyle}>Vehicle no. (optional)</label><input value={vehicleNo} onChange={(e) => setVehicleNo(e.target.value)} className="input" style={{ width: 130 }} /></div>
          <div><label style={labelStyle}>Start KM</label><input type="number" value={startKm} onChange={(e) => setStartKm(e.target.value)} className="input" style={{ width: 100 }} /></div>
          <div><label style={labelStyle}>End KM</label><input type="number" value={endKm} onChange={(e) => setEndKm(e.target.value)} className="input" style={{ width: 100 }} /></div>
          <div><label style={labelStyle}>Mileage (km/l)</label><input type="number" value={mileage} onChange={(e) => onSetMileage(Number(e.target.value) || 0)} className="input" style={{ width: 90 }} /></div>
        </div>
        <div style={{ marginTop: 10 }}>
          <label style={labelStyle}>Purpose of visit</label>
          <input value={purpose} onChange={(e) => setPurpose(e.target.value)} placeholder="e.g. Inspection of PMGSY road at Kantapada" className="input" />
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10, flexWrap: 'wrap', gap: 8 }}>
          <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.inkSoft }}>{distance != null ? `${distance} km · ${fuel.toFixed(2)} L fuel (est.)` : 'Enter start & end KM'}</div>
          <button onClick={submit} className="btn-primary"><Plus size={13} style={{ marginRight: 4 }} /> Add entry</button>
        </div>
      </div>

      <div style={{ marginTop: 16 }}>
        {sorted.length === 0 ? <div style={{ color: C.khaki, fontSize: 13, padding: '10px 4px' }}>No field visits logged yet.</div> : (
          sorted.map((l) => (
            <div key={l.id} className="row-hover" style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '10px 4px', borderBottom: `1px solid ${C.lineSoft}` }}>
              <Car size={16} color={C.navy} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13.5, fontWeight: 500 }}>{l.purpose}</div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: C.inkSoft, marginTop: 2 }}>
                  {fmtDate(l.date)}{l.vehicleNo ? ` · ${l.vehicleNo}` : ''} · {l.startKm}–{l.endKm} km ({l.distance} km) · {l.fuelUsed.toFixed(2)} L
                </div>
              </div>
              <ConfirmDelete onConfirm={() => onDelete(l.id)} label="Delete trip" />
            </div>
          ))
        )}
      </div>
    </div>
  );
}

function AbstractSection({ schemes, subSchemes, projects, onDownload }) {
  const rows = schemes.map((s) => {
    const schemeProjects = projects.filter((p) => p.schemeId === s.id);
    const byYear = {};
    schemeProjects.forEach((p) => {
      const y = p.year || 'Unspecified';
      byYear[y] = byYear[y] || { total: 0, ongoing: 0, completed: 0 };
      byYear[y].total++;
      if (p.status === 'Completed') byYear[y].completed++; else byYear[y].ongoing++;
    });
    return {
      scheme: s, total: schemeProjects.length,
      ongoing: schemeProjects.filter((p) => p.status !== 'Completed').length,
      completed: schemeProjects.filter((p) => p.status === 'Completed').length,
      years: Object.keys(byYear).sort().reverse(), byYear,
      subCount: subSchemes.filter((ss) => ss.schemeId === s.id).length,
    };
  });
  const grandTotal = projects.length;
  const grandOngoing = projects.filter((p) => p.status !== 'Completed').length;
  const grandCompleted = projects.filter((p) => p.status === 'Completed').length;

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10, marginBottom: 6 }}>
        <div>
          <div style={{ fontSize: 18, fontWeight: 700 }}>Scheme Abstract</div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.inkSoft, marginTop: 2 }}>
            All schemes at a glance — {grandTotal} total · {grandOngoing} ongoing · {grandCompleted} completed
          </div>
        </div>
        <button onClick={onDownload} className="btn-primary"><FileSpreadsheet size={13} style={{ marginRight: 6 }} /> Export to Excel</button>
      </div>

      <div style={{ display: 'grid', gap: 16, marginTop: 16 }}>
        {rows.map((r, rIdx) => (
          <div key={r.scheme.id} className="card" style={{ padding: 16, borderLeft: `4px solid ${schemeColor(rIdx)}` }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', flexWrap: 'wrap', gap: 10 }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: schemeColor(rIdx) }}>
                {r.scheme.name}{r.subCount > 0 && <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: C.khaki, fontWeight: 500 }}> · {r.subCount} sub-scheme{r.subCount !== 1 ? 's' : ''}</span>}
              </div>
              <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.inkSoft }}>{r.total} total · {r.ongoing} ongoing · {r.completed} completed</div>
            </div>
            {r.years.length === 0 ? (
              <div style={{ color: C.khaki, fontSize: 12.5, marginTop: 8 }}>No projects filed under this scheme yet.</div>
            ) : (
              <table className="abstract-table">
                <thead><tr><th>Financial Year</th><th>Total</th><th>Ongoing</th><th>Completed</th></tr></thead>
                <tbody>
                  {r.years.map((y) => (
                    <tr key={y}>
                      <td>{y === 'Unspecified' ? '—' : `FY ${y}`}</td>
                      <td>{r.byYear[y].total}</td>
                      <td style={{ color: C.warning }}>{r.byYear[y].ongoing}</td>
                      <td style={{ color: C.success }}>{r.byYear[y].completed}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function MonthlyProgressSection({ schemes, entries, onAdd, onOpenFile, onDelete }) {
  const categories = [...schemes.map((s) => ({ id: s.id, label: s.name })), { id: 'buildings', label: 'Buildings' }];
  const [categoryId, setCategoryId] = useState(categories[0] ? categories[0].id : 'buildings');
  const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));
  const inputRef = useRef(null);
  const [pendingFiles, setPendingFiles] = useState(null);

  function submit() {
    if (!pendingFiles || !pendingFiles.length) { alert('Please choose an Excel file to upload.'); return; }
    const cat = categories.find((c) => c.id === categoryId);
    onAdd(categoryId, cat ? cat.label : categoryId, month, pendingFiles);
    setPendingFiles(null);
    if (inputRef.current) inputRef.current.value = '';
  }

  const sorted = [...entries].sort((a, b) => b.month.localeCompare(a.month) || b.createdAt - a.createdAt);
  const grouped = {};
  sorted.forEach((e) => { (grouped[e.categoryLabel] = grouped[e.categoryLabel] || []).push(e); });

  return (
    <div>
      <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>Monthly Progress Reports</div>
      <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.inkSoft, marginBottom: 16 }}>Upload the monthly progress Excel sheet for each scheme to track it over time.</div>

      <div className="card">
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'flex-end' }}>
          <div><label style={labelStyle}>Scheme / category</label>
            <select value={categoryId} onChange={(e) => setCategoryId(e.target.value)} className="input" style={{ width: 170 }}>
              {categories.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
            </select>
          </div>
          <div><label style={labelStyle}>Month</label><input type="month" value={month} onChange={(e) => setMonth(e.target.value)} className="input" style={{ width: 150 }} /></div>
          <div style={{ flex: 1, minWidth: 200 }}>
            <label style={labelStyle}>Excel file</label>
            <input ref={inputRef} type="file" accept={ACCEPT_SHEET} onChange={(e) => setPendingFiles(e.target.files)} style={{ fontSize: 12.5 }} />
          </div>
          <button onClick={submit} className="btn-primary"><Upload size={13} style={{ marginRight: 5 }} /> Upload</button>
        </div>
      </div>

      <div style={{ marginTop: 20 }}>
        {Object.keys(grouped).length === 0 ? <div style={{ color: C.khaki, fontSize: 13 }}>No monthly reports uploaded yet.</div> : (
          Object.keys(grouped).map((label) => (
            <div key={label} style={{ marginBottom: 18 }}>
              <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 13, color: C.navy, borderBottom: `1px solid ${C.line}`, paddingBottom: 4, marginBottom: 6 }}>{label}</div>
              {grouped[label].map((e) => (
                <div key={e.id} className="row-hover" style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 4px', borderBottom: `1px solid ${C.lineSoft}`, flexWrap: 'wrap' }}>
                  <FileSpreadsheet size={16} color={C.navy} />
                  <div style={{ flex: 1, minWidth: 100 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 500 }}>{e.month}</div>
                    <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: C.inkSoft }}>{(e.fileIds || []).length} file{(e.fileIds || []).length !== 1 ? 's' : ''}</div>
                  </div>
                  {(e.fileIds || []).map((fid) => (
                    <button key={fid} onClick={() => onOpenFile(fid)} className="btn-ghost" style={{ padding: '4px 9px', fontSize: 11.5 }}><Eye size={12} style={{ marginRight: 4 }} />View</button>
                  ))}
                  <ConfirmDelete onConfirm={() => onDelete(e.id)} label="Delete report" />
                </div>
              ))}
            </div>
          ))
        )}
      </div>
    </div>
  );
}

function ProposalsSection({ kind, entries, schemes, subSchemes, onAdd, onOpenFile, onDelete }) {
  const isAmp = kind === 'amp';
  const [fy, setFy] = useState(currentFY());
  const [schemeId, setSchemeId] = useState('');
  const [subSchemeId, setSubSchemeId] = useState('');
  const [projectType, setProjectType] = useState('Road');
  const [status, setStatus] = useState('Proposed');
  const [notes, setNotes] = useState('');
  const inputRef = useRef(null);
  const [pendingFiles, setPendingFiles] = useState(null);

  const schemeSubs = subSchemes.filter((ss) => ss.schemeId === schemeId);

  function submit() {
    if (!pendingFiles || !pendingFiles.length) { alert('Please choose at least one file to attach.'); return; }
    onAdd({ financialYear: fy || currentFY(), schemeId: schemeId || null, subSchemeId: subSchemeId || null, projectType: isAmp ? null : projectType, status, notes }, pendingFiles);
    setNotes(''); setPendingFiles(null);
    if (inputRef.current) inputRef.current.value = '';
  }

  const sorted = [...entries].sort((a, b) => b.financialYear.localeCompare(a.financialYear) || b.createdAt - a.createdAt);
  const grouped = {};
  sorted.forEach((e) => { (grouped[e.financialYear] = grouped[e.financialYear] || []).push(e); });

  return (
    <div>
      <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>{isAmp ? 'Annual Maintenance Plan' : 'Scheme Proposals'}</div>
      <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.inkSoft, marginBottom: 16 }}>
        {isAmp ? 'Proposed and approved maintenance plans, filed by financial year.' : 'Road, bridge and building proposals, filed by scheme and financial year.'}
      </div>

      <div className="card">
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'flex-end' }}>
          <div><label style={labelStyle}>Financial year</label><input value={fy} onChange={(e) => setFy(e.target.value)} placeholder="2026-27" className="input" style={{ width: 100 }} list="fy-options" /></div>
          <div><label style={labelStyle}>Scheme{isAmp ? ' (optional)' : ''}</label>
            <select value={schemeId} onChange={(e) => { setSchemeId(e.target.value); setSubSchemeId(''); }} className="input" style={{ width: 150 }}>
              <option value="">{isAmp ? 'General' : 'Select scheme'}</option>
              {schemes.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </div>
          {schemeSubs.length > 0 && (
            <div><label style={labelStyle}>Sub-scheme</label>
              <select value={subSchemeId} onChange={(e) => setSubSchemeId(e.target.value)} className="input" style={{ width: 150 }}>
                <option value="">— none —</option>
                {schemeSubs.map((ss) => <option key={ss.id} value={ss.id}>{ss.name}</option>)}
              </select>
            </div>
          )}
          {!isAmp && (
            <div><label style={labelStyle}>Work type</label>
              <select value={projectType} onChange={(e) => setProjectType(e.target.value)} className="input" style={{ width: 120 }}>
                {PROJECT_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
          )}
          <div><label style={labelStyle}>Status</label>
            <select value={status} onChange={(e) => setStatus(e.target.value)} className="input" style={{ width: 120 }}>
              {PROPOSAL_STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        </div>
        <div style={{ marginTop: 10 }}>
          <label style={labelStyle}>Notes (optional)</label>
          <input value={notes} onChange={(e) => setNotes(e.target.value)} className="input" placeholder="e.g. covers 12 roads, 4 blocks" />
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10, flexWrap: 'wrap', gap: 8 }}>
          <input ref={inputRef} type="file" multiple accept={ACCEPT_DOC} onChange={(e) => setPendingFiles(e.target.files)} style={{ fontSize: 12.5 }} />
          <button onClick={submit} className="btn-primary"><Upload size={13} style={{ marginRight: 5 }} /> File this entry</button>
        </div>
      </div>

      <div style={{ marginTop: 20 }}>
        {Object.keys(grouped).length === 0 ? <div style={{ color: C.khaki, fontSize: 13, padding: '10px 4px' }}>Nothing filed yet.</div> : (
          Object.keys(grouped).sort().reverse().map((fyKey) => (
            <div key={fyKey} style={{ marginBottom: 18 }}>
              <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 13, color: C.navy, borderBottom: `1px solid ${C.line}`, paddingBottom: 4, marginBottom: 6 }}>FY {fyKey}</div>
              {grouped[fyKey].map((e) => {
                const scheme = schemes.find((s) => s.id === e.schemeId);
                const sub = subSchemes.find((s) => s.id === e.subSchemeId);
                return (
                  <div key={e.id} className="row-hover" style={{ padding: '9px 4px', borderBottom: `1px solid ${C.lineSoft}` }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 6 }}>
                      <div style={{ fontSize: 13.5, fontWeight: 500 }}>{scheme ? scheme.name : 'General'}{sub ? ` · ${sub.name}` : ''}{e.projectType ? ` · ${e.projectType}` : ''}</div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span style={{ fontFamily: FONT_MONO, fontSize: 11, padding: '2px 8px', borderRadius: 20, border: `1px solid ${e.status === 'Approved' ? C.success : C.warning}`, color: e.status === 'Approved' ? C.success : C.warning }}>{e.status}</span>
                        <ConfirmDelete onConfirm={() => onDelete(e.id)} label="Delete entry" />
                      </div>
                    </div>
                    {e.notes && <div style={{ fontSize: 12.5, color: C.inkSoft, marginTop: 3 }}>{e.notes}</div>}
                    <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginTop: 5 }}>
                      {(e.fileIds || []).map((fid) => (
                        <button key={fid} onClick={() => onOpenFile(fid)} className="btn-ghost" style={{ padding: '3px 8px', fontSize: 11.5 }}><FileText size={12} style={{ marginRight: 4 }} /> View file</button>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          ))
        )}
      </div>
    </div>
  );
}

function FileViewerModal({ meta, dataUrl, onClose }) {
  const isImage = meta.mimeType && meta.mimeType.startsWith('image/');
  const isPdf = meta.mimeType === 'application/pdf';
  const isSheet = meta.mimeType && (meta.mimeType.includes('sheet') || meta.mimeType.includes('excel') || meta.mimeType.includes('csv') || /\.(xlsx|xls|csv)$/i.test(meta.name || ''));
  const [rows, setRows] = useState(null);
  const [sheetError, setSheetError] = useState(false);

  useEffect(() => {
    if (isSheet) {
      try {
        const base64 = dataUrl.split(',')[1];
        const wb = XLSX.read(base64, { type: 'base64' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        setRows(data.slice(0, 300));
      } catch (e) { setSheetError(true); }
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(15,18,13,0.85)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100, padding: 20 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: isImage ? 'transparent' : '#fff', maxWidth: '92vw', maxHeight: '90vh', width: (isPdf || isSheet) ? 820 : undefined, borderRadius: 8, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: isImage ? '0 0 8px' : '10px 14px', color: isImage ? C.paper : C.ink, borderBottom: isImage ? 'none' : `1px solid ${C.line}` }}>
          <div style={{ fontFamily: FONT_MONO, fontSize: 12, fontWeight: 600 }}>{meta.name}</div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: isImage ? C.paper : C.ink, cursor: 'pointer' }}><X size={19} /></button>
        </div>

        {isImage && <img src={dataUrl} alt={meta.name} style={{ maxWidth: '90vw', maxHeight: '74vh', display: 'block', borderRadius: 6 }} />}
        {isPdf && <iframe src={dataUrl} title={meta.name} style={{ width: '100%', height: '70vh', border: 'none' }} />}
        {isSheet && (
          sheetError ? <div style={{ padding: 20, fontSize: 13, color: C.inkSoft }}>Couldn't preview this spreadsheet. Download it instead.</div> :
          !rows ? <div style={{ padding: 20, fontSize: 13, color: C.inkSoft }}>Loading preview…</div> :
          <div style={{ overflow: 'auto', maxHeight: '70vh', padding: 10 }}>
            <table style={{ borderCollapse: 'collapse', fontSize: 12, fontFamily: FONT_MONO }}>
              <tbody>
                {rows.map((r, i) => (
                  <tr key={i}>{r.map((c, j) => <td key={j} style={{ border: `1px solid ${C.lineSoft}`, padding: '4px 7px', whiteSpace: 'nowrap' }}>{String(c)}</td>)}</tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        {!isImage && !isPdf && !isSheet && <div style={{ padding: 20, fontSize: 13, color: C.inkSoft }}>Preview isn't available for this file type. Use download below.</div>}

        <div style={{ padding: isImage ? '10px 0 0' : '10px 14px', display: 'flex', justifyContent: 'flex-end' }}>
          <button onClick={() => downloadDataUrl(dataUrl, meta.name)} className="btn-ghost" style={{ color: isImage ? C.paper : C.inkSoft, borderColor: isImage ? C.paper : C.line }}>
            <Download size={13} style={{ marginRight: 5 }} /> Download
          </button>
        </div>
      </div>
    </div>
  );
}
